<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · OmnIkestrAPIM</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; background: #101820; color: #f4f7fa; }
    main { width: min(22rem, calc(100vw - 3rem)); padding: 2rem; border: 1px solid #344454; border-radius: 1rem; background: #192632; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    label { display: block; margin: 1rem 0 .4rem; }
    input, button { box-sizing: border-box; width: 100%; padding: .8rem; border-radius: .5rem; font: inherit; }
    input { border: 1px solid #506274; background: #101820; color: inherit; }
    button { margin-top: 1rem; border: 0; background: #76c7a2; color: #10251c; font-weight: 700; cursor: pointer; }
    #message { min-height: 1.5rem; color: #ff9a9a; }
  </style>
</head>
<body>
  <main>
    <h1>OmnIkestrAPIM</h1>
    <form id="login-form">
      <label for="password">Senha do administrador</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Entrar</button>
      <p id="message" role="alert"></p>
    </form>
  </main>
  <script>
    const form = document.querySelector("#login-form");
    const message = document.querySelector("#message");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = form.querySelector("button");
      button.disabled = true;
      message.textContent = "";
      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: form.elements.password.value }),
        });
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail || "Não foi possível entrar.");
        window.location.assign("/");
      } catch (error) {
        message.textContent = error.message || "Falha de autenticação.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
