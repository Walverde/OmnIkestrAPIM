services:
  db:
    image: postgres:16-alpine
    container_name: omnikestr_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omnikestr}
      POSTGRES_USER: ${POSTGRES_USER:-omnikestr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnikestr_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - omnikestr_network

  backend:
    build:
      context: ../services/backend
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-0.2.0}
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: omnikestr_backend
    restart: always
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-omnikestr}:${POSTGRES_PASSWORD:-omnikestr_dev}@db:5432/${POSTGRES_DB:-omnikestr}
      - PRODUCTS_ROOT=/data/products
      - PICKER_TOKEN=${PICKER_TOKEN:-}
      - OMNIKESTRAPIM_API_KEY=${OMNIKESTRAPIM_API_KEY:?Configure OMNIKESTRAPIM_API_KEY}
      - OMNIKESTRAPIM_ADMIN_PASSWORD=${OMNIKESTRAPIM_ADMIN_PASSWORD:?Configure OMNIKESTRAPIM_ADMIN_PASSWORD}
      - OMNIKESTRAPIM_SESSION_SECRET=${OMNIKESTRAPIM_SESSION_SECRET:?Configure OMNIKESTRAPIM_SESSION_SECRET}
      - OMNIKESTRAPIM_COOKIE_SECURE=${OMNIKESTRAPIM_COOKIE_SECURE:-false}
      - UVICORN_PROXY_HEADERS=${UVICORN_PROXY_HEADERS:-true}
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
      - BUILD_VERSION=${BUILD_VERSION:-0.2.0}
      - BUILD_COMMIT=${BUILD_COMMIT:-unknown}
      - BUILD_DATE=${BUILD_DATE:-unknown}
    volumes:
      - ../services/backend:/app
      - type: bind
        source: "${PRODUCTS_DIR:-../Products}"
        target: /data/products
    depends_on:
      db:
        condition: service_healthy
    networks:
      - omnikestr_network

  watcher:
    build:
      context: ../services/watcher
      dockerfile: Dockerfile
    container_name: omnikestr_watcher
    restart: always
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - PYTHONUNBUFFERED=1
      - WATCH_DIRS=/data/products
      - OMNIKESTRAPIM_API_KEY=${OMNIKESTRAPIM_API_KEY:?Configure OMNIKESTRAPIM_API_KEY}
      # Caso o watcher precise se comunicar diretamente com o backend:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ../services/watcher:/app
      - type: bind
        source: "${PRODUCTS_DIR:-../Products}"
        target: /data/products
    depends_on:
      - backend
    networks:
      - omnikestr_network

networks:
  omnikestr_network:
    driver: bridge

volumes:
  postgres_data: