name: Publish TrueNAS container images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/walverde/omnikestrapim-backend
          tags: |
            type=semver,pattern={{version}}

      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: ./services/backend
          file: ./services/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Extract watcher image metadata
        id: watcher-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/walverde/omnikestrapim-watcher
          tags: |
            type=semver,pattern={{version}}

      - name: Build and publish watcher
        uses: docker/build-push-action@v6
        with:
          context: ./services/watcher
          file: ./services/watcher/Dockerfile
          push: true
          tags: ${{ steps.watcher-meta.outputs.tags }}
          labels: ${{ steps.watcher-meta.outputs.labels }}
