name: omnikestr

services:
  db:
    image: ${OMNIKESTRAPIM_POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omnikestr}
      POSTGRES_USER: ${POSTGRES_USER:-omnikestr}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - type: bind
        source: ${APPS_ROOT:?Configure APPS_ROOT}/OmnIkestrAPIM/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - omnikestr
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ghcr.io/walverde/omnikestrapim-backend:${OMNIKESTRAPIM_VERSION:-latest}
    user: "568:568"
    command:
      - /bin/sh
      - -ec
      - |
        DB_PASSWORD="$$(cat /run/secrets/postgres_password)"
        export DATABASE_URL="postgresql+psycopg2://$${POSTGRES_USER}:$${DB_PASSWORD}@db:5432/$${POSTGRES_DB}"
        exec python -m backend_core.server
    ports:
      - "${BIND_IP:-0.0.0.0}:${OMNIKESTRAPIM_PORT:-8000}:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      POSTGRES_DB: ${POSTGRES_DB:-omnikestr}
      POSTGRES_USER: ${POSTGRES_USER:-omnikestr}
      PRODUCTS_ROOT: /data/products
      PRODUCT_ROOTS: /data/products
      OMNIKESTRAPIM_API_KEY: "${OMNIKESTRAPIM_API_KEY:?Configure OMNIKESTRAPIM_API_KEY}"
      OMNIKESTRAPIM_ADMIN_PASSWORD: "${OMNIKESTRAPIM_ADMIN_PASSWORD:?Configure OMNIKESTRAPIM_ADMIN_PASSWORD}"
      OMNIKESTRAPIM_SESSION_SECRET: "${OMNIKESTRAPIM_SESSION_SECRET:?Configure OMNIKESTRAPIM_SESSION_SECRET}"
      OMNIKESTRAPIM_COOKIE_SECURE: "${OMNIKESTRAPIM_COOKIE_SECURE:-false}"
      UVICORN_PROXY_HEADERS: "${UVICORN_PROXY_HEADERS:-true}"
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
    secrets:
      - postgres_password
    volumes:
      - type: bind
        source: ${APPS_ROOT:?Configure APPS_ROOT}/OmnIkestrAPIM-Products
        target: /data/products
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - omnikestr
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    tmpfs:
      - "/tmp:size=268435456"

  watcher:
    image: ghcr.io/walverde/omnikestrapim-watcher:${OMNIKESTRAPIM_VERSION:-latest}
    user: "568:568"
    environment:
      PYTHONUNBUFFERED: "1"
      WATCH_DIRS: /data/products
      BACKEND_URL: http://backend:8000
      OMNIKESTRAPIM_API_KEY: "${OMNIKESTRAPIM_API_KEY:?Configure OMNIKESTRAPIM_API_KEY}"
    volumes:
      - type: bind
        source: ${APPS_ROOT:?Configure APPS_ROOT}/OmnIkestrAPIM-Products
        target: /data/products
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; p='/tmp/watcher-heartbeat'; raise SystemExit(0 if os.path.isfile(p) and time.time()-os.path.getmtime(p)<45 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - omnikestr
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    tmpfs:
      - "/tmp:size=16777216"

networks:
  omnikestr:
    driver: bridge

secrets:
  postgres_password:
    file: ${APPS_ROOT:?Configure APPS_ROOT}/OmnIkestrAPIM/secrets/postgres_password
